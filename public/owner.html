<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DANGER OWNER CONTROL</title><link rel="stylesheet" href="/style.css">
<style>
.owner-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}.owner-stat{padding:18px;border:1px solid rgba(255,60,60,.25);border-radius:14px;background:linear-gradient(145deg,#171717,#0d0d0d);box-shadow:0 8px 25px rgba(0,0,0,.25)}.owner-stat b{display:block;font-size:28px;color:#fff}.owner-stat span{color:#aaa;font-size:12px}.owner-tools{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.owner-tools input,.owner-tools select{min-width:180px;flex:1}.key-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.reseller-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.expired{color:#ff5252;font-weight:700}@media(max-width:800px){.owner-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head>
<body>
<div id="app"><header><div class="brand">🛡️ <b>DANGER OWNER CONTROL</b></div><a href="/admin" style="color:#fff;text-decoration:none">MASTER ADMIN</a></header>
<main style="margin-left:0;max-width:1250px;margin:auto;padding:28px"><section class="page">
<div class="row"><h2>OWNER CONTROL</h2><button onclick="loadAll()">↻ REFRESH</button></div>
<div class="owner-grid"><div class="owner-stat"><span>TOTAL CUSTOMERS</span><b id="statTotal">0</b></div><div class="owner-stat"><span>ACTIVE</span><b id="statActive">0</b></div><div class="owner-stat"><span>BLOCKED</span><b id="statBlocked">0</b></div><div class="owner-stat"><span>EXPIRING SOON</span><b id="statSoon">0</b></div></div>
<div class="card owner-tools"><input id="panelSearch" placeholder="🔎 Search customer panel..." oninput="renderPanels()"><select id="panelFilter" onchange="renderPanels()"><option value="all">All Panels</option><option value="active">Active</option><option value="blocked">Blocked</option><option value="soon">Expiring Soon</option></select></div>

<div class="card formcard" style="max-width:760px"><h3>ADD CUSTOMER PANEL</h3>
<label>Panel Name</label><input id="pn" placeholder="Customer / Brand name"><label>Panel URL</label><input id="pu" placeholder="https://customer.onrender.com"><label>Customer Admin Username</label><input id="puser" placeholder="customer username"><label>Validity Days</label><input id="pdays" type="number" min="1" max="3650" value="30"><label>Control Secret (32+ chars)</label><input id="psecret" type="password" placeholder="Same secret must be set on customer panel"><button onclick="createPanel()">ADD CUSTOMER PANEL</button><div id="msg" class="copy-msg"></div></div>

<div class="card formcard" style="max-width:760px"><h3>GENERATE CUSTOMER KEY</h3>
<label>Customer Panel</label><select id="kgpanel"></select><label>Game / APK Name</label><input id="kgame" value="My APK"><label>Duration</label><select id="kdur"><option>5 Hours</option><option>12 Hours</option><option>1 Day</option><option>7 Days</option><option>15 Days</option><option>1 Month</option><option>2 Months</option><option>Lifetime</option></select><label>Maximum Devices</label><input id="kdev" type="number" min="1" max="2000" value="1"><label>Quantity</label><input id="kqty" type="number" min="1" max="100" value="1"><button onclick="generateCustomerKeys()">GENERATE KEY(S)</button><div id="keymsg" class="copy-msg"></div><pre id="keyout" style="white-space:pre-wrap"></pre><div class="key-actions"><button onclick="copyAllKeys()">📋 COPY ALL</button><button onclick="clearKeys()">CLEAR</button></div></div>

<div class="card"><div class="row"><h3>RESELLER PANELS</h3><span class="muted">All reseller accounts created from Master Admin</span></div><div class="card owner-tools"><input id="resellerSearch" placeholder="🔎 Search reseller..." oninput="renderResellers()"><select id="resellerFilter" onchange="renderResellers()"><option value="all">All</option><option value="active">Active</option><option value="blocked">Blocked</option><option value="expired">Expired</option></select></div><div id="resellers" class="reseller-grid"></div></div>


<div class="card"><div class="row"><h3>OWNER ACTIVITY</h3><button onclick="loadActivity()">↻ REFRESH</button></div>
<div class="card"><h4>RECENT AUDIT LOGS</h4><div id="auditLogs">Loading...</div></div>
<div class="card"><h4>RECENT TRANSACTIONS</h4><div id="ownerTransactions">Loading...</div></div></div>
<div id="panels"></div></section></main></div>
<script>
const $=id=>document.getElementById(id);
async function api(url,opt={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Request failed');return d}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]||m))}
function fmt(x){return x?new Date(x).toLocaleString():'—'}
function expired(x){return !!x&&new Date(x)<=new Date()}
function soon(x){if(!x)return false;const t=new Date(x).getTime()-Date.now();return t>0&&t<=7*86400000}
let ownerPanelsCache=[],resellerCache=[];
function renderStats(){const r=ownerPanelsCache;$('statTotal').textContent=r.length;$('statActive').textContent=r.filter(p=>p.active).length;$('statBlocked').textContent=r.filter(p=>!p.active).length;$('statSoon').textContent=r.filter(p=>p.active&&soon(p.panel_expires_at)).length}
function renderPanels(){const q=($('panelSearch').value||'').toLowerCase().trim(),f=$('panelFilter').value;const rows=ownerPanelsCache.filter(p=>{const t=(p.panel_name+' '+p.panel_url+' '+(p.owner_username||'')).toLowerCase();if(q&&!t.includes(q))return false;if(f==='active'&&!p.active)return false;if(f==='blocked'&&p.active)return false;if(f==='soon'&&!(p.active&&soon(p.panel_expires_at)))return false;return true});$('panels').innerHTML=rows.map(p=>{const dl=p.panel_expires_at?Math.ceil((new Date(p.panel_expires_at)-Date.now())/86400000):0;return `<div class="card"><div class="row"><div><h3>${esc(p.panel_name)}</h3><div class="muted">${esc(p.panel_url)}</div></div><span class="pill ${p.active?'':'danger-pill'}">${p.active?'ACTIVE':'BLOCKED'}</span></div><p>Admin: <b>${esc(p.owner_username||'—')}</b> · Expiry: <b>${fmt(p.panel_expires_at)}</b> · Remaining: <b>${dl>0?dl+' days':'EXPIRED'}</b></p><div class="row" style="flex-wrap:wrap"><button onclick="control(${p.id},'block')">BLOCK</button><button onclick="control(${p.id},'unblock')">UNBLOCK</button><button onclick="quickExtend(${p.id},7)">+7D</button><button onclick="quickExtend(${p.id},30)">+30D</button><button onclick="quickExtend(${p.id},90)">+90D</button><button onclick="extendPanel(${p.id})">CUSTOM EXTEND</button><button onclick="resetCreds(${p.id})">RESET LOGIN</button><button class="danger" onclick="removeRecord(${p.id})">REMOVE RECORD</button></div></div>`}).join('')||'<div class="card">No matching customer panels.</div>'}
function renderResellers(){const q=($('resellerSearch').value||'').toLowerCase().trim(),f=$('resellerFilter').value;const rows=resellerCache.filter(u=>{const ex=expired(u.panel_expires_at);const t=(u.username+' '+(u.referral_code||'')).toLowerCase();if(q&&!t.includes(q))return false;if(f==='active'&&(!u.active||ex))return false;if(f==='blocked'&&u.active)return false;if(f==='expired'&&!ex)return false;return true});$('resellers').innerHTML=rows.map(u=>{const ex=expired(u.panel_expires_at);const dl=u.panel_expires_at?Math.ceil((new Date(u.panel_expires_at)-Date.now())/86400000):null;return `<div class="card"><div class="row"><h3>${esc(u.username)}</h3><span class="pill ${u.active&&!ex?'':'danger-pill'}">${!u.active?'BLOCKED':ex?'EXPIRED':'ACTIVE'}</span></div><p>Panel: <b>/reseller</b><br>Expiry: <b>${fmt(u.panel_expires_at)}</b><br>Remaining: <b class="${ex?'expired':''}">${dl===null?'LIFETIME':dl>0?dl+' days':'EXPIRED'}</b><br>Balance: <b>₹${u.balance||0}</b></p><div class="row" style="flex-wrap:wrap"><button onclick="toggleReseller(${u.id},${u.active?0:1})">${u.active?'BLOCK':'UNBLOCK'}</button><button onclick="extendReseller(${u.id})">EXTEND</button><button onclick="editReseller(${u.id})">EDIT LOGIN</button><button class="danger" onclick="deleteReseller(${u.id},'${esc(u.username)}')">DELETE PANEL</button></div></div>`}).join('')||'<div class="card">No reseller panels found.</div>'}
async function loadAll(){await Promise.all([loadPanels(),loadResellers()])}
async function loadPanels(){try{const rows=await api('/api/owner/panels');ownerPanelsCache=rows;$('kgpanel').innerHTML=rows.map(p=>`<option value="${p.id}">${esc(p.panel_name)} — ${esc(p.panel_url)}</option>`).join('');renderStats();renderPanels()}catch(e){$('panels').innerHTML='<div class="card">'+esc(e.message)+'</div>'}}
async function loadResellers(){try{resellerCache=await api('/api/users');renderResellers()}catch(e){$('resellers').innerHTML='<div class="card">'+esc(e.message)+'</div>'}}
async function createPanel(){try{const d=await api('/api/owner/panels',{method:'POST',body:JSON.stringify({panelName:$('pn').value,panelUrl:$('pu').value,ownerUsername:$('puser').value,days:Number($('pdays').value),controlSecret:$('psecret').value})});$('msg').textContent='Customer panel registered. ID: '+d.id;loadPanels()}catch(e){$('msg').textContent=e.message}}
async function generateCustomerKeys(){const id=Number($('kgpanel').value),p=ownerPanelsCache.find(x=>x.id===id);if(!p)return;$('keymsg').textContent='Generating...';try{const d=await api('/api/owner/panels/'+id+'/control',{method:'POST',body:JSON.stringify({action:'generate_key',game:$('kgame').value,duration:$('kdur').value,maxDevices:Number($('kdev').value),quantity:Number($('kqty').value)})});$('keyout').textContent=d.keys.map(x=>x.key).join('\n');$('keymsg').textContent='Generated '+d.keys.length+' key(s) for '+p.panel_name}catch(e){$('keymsg').textContent=e.message;$('keyout').textContent=''}}
async function copyAllKeys(){const t=$('keyout').textContent.trim();if(!t){$('keymsg').textContent='No keys to copy';return}try{await navigator.clipboard.writeText(t);$('keymsg').textContent='All keys copied ✅'}catch(e){$('keymsg').textContent='Copy failed — long press and copy manually'}}
function clearKeys(){$('keyout').textContent='';$('keymsg').textContent=''}
async function control(id,action){if(!confirm(action.toUpperCase()+' this customer panel?'))return;try{await api('/api/owner/panels/'+id+'/control',{method:'POST',body:JSON.stringify({action})});loadPanels()}catch(e){alert(e.message)}}
async function quickExtend(id,days){try{await api('/api/owner/panels/'+id+'/control',{method:'POST',body:JSON.stringify({action:'extend',days})});loadPanels()}catch(e){alert(e.message)}}
async function extendPanel(id){const days=prompt('Kitne din extend karna hai?','30');if(days===null)return;try{await api('/api/owner/panels/'+id+'/control',{method:'POST',body:JSON.stringify({action:'extend',days:Number(days)})});loadPanels()}catch(e){alert(e.message)}}
async function resetCreds(id){const username=prompt('New customer username:');if(username===null)return;const password=prompt('New customer password (8+ chars):');if(password===null)return;try{await api('/api/owner/panels/'+id+'/control',{method:'POST',body:JSON.stringify({action:'reset_credentials',username,password})});loadPanels();alert('Customer login reset ho gaya.')}catch(e){alert(e.message)}}
async function removeRecord(id){if(!confirm('Sirf owner registry se record remove hoga. Customer panel delete nahi hoga. Continue?'))return;await api('/api/owner/panels/'+id,{method:'DELETE'});loadPanels()}
async function toggleReseller(id,active){try{await api('/api/users/'+id,{method:'PATCH',body:JSON.stringify({active})});loadResellers()}catch(e){alert(e.message)}}
async function extendReseller(id){const days=prompt('Kitne din ka expiry set karna hai? Blank = lifetime','30');if(days===null)return;try{await api('/api/users/'+id,{method:'PATCH',body:JSON.stringify({panelDays:days===''?null:Number(days)})});loadResellers()}catch(e){alert(e.message)}}
async function editReseller(id){const u=resellerCache.find(x=>x.id===id);if(!u)return;const username=prompt('New username:',u.username);if(username===null)return;const password=prompt('New password (8+ chars):');if(password===null)return;try{await api('/api/users/'+id,{method:'PATCH',body:JSON.stringify({username,password})});loadResellers();alert('Reseller login updated.')}catch(e){alert(e.message)}}
async function deleteReseller(id,name){if(!confirm('DELETE '+name+' reseller panel? Is reseller ke keys, transactions aur account delete honge.'))return;try{await api('/api/users/'+id,{method:'DELETE'});loadResellers()}catch(e){alert(e.message)}}
loadAll();loadActivity();

async function loadActivity(){
 try{
  const [logs,tx]=await Promise.all([api('/api/audit-logs?limit=30'),api('/api/transactions?limit=30')]);
  $('auditLogs').innerHTML=logs.length?logs.map(x=>'<div style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,.08)"><b>'+esc(x.event_type)+'</b> · '+esc(x.username||'system')+' · '+fmt(x.created_at)+'<br><span class="muted">'+esc(x.metadata||'{}')+'</span></div>').join(''):'<div class="muted">No audit activity.</div>';
  $('ownerTransactions').innerHTML=tx.length?tx.map(x=>'<div style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,.08)"><b>'+esc(x.type)+'</b> · '+esc(x.username||'—')+' · ₹'+esc(x.amount)+' · '+fmt(x.created_at)+'<br><span class="muted">'+esc(x.description||'')+'</span></div>').join(''):'<div class="muted">No transactions.</div>';
 }catch(e){
  $('auditLogs').textContent=e.message;$('ownerTransactions').textContent=e.message;
 }
}
</script></body></html>
