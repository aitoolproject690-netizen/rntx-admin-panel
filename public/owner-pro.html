<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DANGER OWNER PRO</title><style>
:root{--r:#ff2447;--bg:#07080d;--card:#11131b;--muted:#8d93a3;--ok:#35e27b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#2a0b16,#07080d 42%);color:#f5f7fb;font-family:system-ui,Arial}header{position:sticky;top:0;z-index:5;padding:16px 20px;background:#07080df0;border-bottom:1px solid #282b38;display:flex;justify-content:space-between}.brand b{color:#ff4965}.wrap{max-width:1250px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.card{background:linear-gradient(145deg,#151722,#0d0f16);border:1px solid #282b38;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 10px 30px #0005}.stat b{display:block;font-size:27px;margin-top:5px}.muted{color:var(--muted);font-size:13px}.toolbar{display:flex;gap:9px;flex-wrap:wrap}.toolbar>*{flex:1;min-width:150px}input,select,button{border:1px solid #343746;border-radius:10px;padding:11px;background:#0b0d13;color:#fff}button{background:linear-gradient(135deg,#ff183f,#a90027);border:0;font-weight:800}button.alt{background:#202330}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.ok{color:var(--ok);font-weight:800}.bad{color:#ff536d;font-weight:800}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:10px;border-bottom:1px solid #262936;text-align:left;font-size:13px}th{color:#9da3b2}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{padding:7px 9px;font-size:11px}.bar{height:10px;background:#292c37;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff1744,#ff6a7f)}@media(max-width:600px){.wrap{padding:12px}}</style></head><body>
<header><div class="brand">🛡️ <b>DANGER OWNER PRO</b></div><a href="/owner" style="color:#fff">OWNER CONTROL</a></header><main class="wrap">
<div class="grid" id="stats"></div>
<div class="card"><div class="row"><div><h2 style="margin:0">⚡ Global Control</h2><span class="muted">Master emergency controls</span></div><button class="alt" onclick="refreshAll()">↻ Sync</button></div><div class="toolbar" style="margin-top:12px"><button onclick="bulkResellers(0)">🚫 Block Resellers</button><button onclick="bulkResellers(1)">✅ Unblock Resellers</button><button onclick="bulkPanels('block')">🛑 Block Customers</button><button onclick="bulkPanels('unblock')">🟢 Unblock Customers</button></div><div id="msg" class="muted"></div></div>
<div class="card"><div class="row"><h2 style="margin:0">📊 Master Analytics</h2><button class="alt" onclick="loadAnalytics()">Refresh</button></div><div id="analytics" class="grid"></div><div id="chart"></div></div>
<div class="card"><div class="row"><h2 style="margin:0">🏢 Customer Panels</h2><button class="alt" onclick="loadPanels()">Refresh</button></div><div class="toolbar"><input id="pq" placeholder="Search panel..." oninput="renderPanels()"><select id="pf" onchange="renderPanels()"><option value="all">All</option><option value="active">Active</option><option value="blocked">Blocked</option><option value="soon">Expiring ≤7d</option></select></div><div class="tablewrap"><table><thead><tr><th>Panel</th><th>Owner</th><th>Status</th><th>Expiry</th><th>Actions</th></tr></thead><tbody id="panels"></tbody></table></div></div>
<div class="card"><div class="row"><h2 style="margin:0">👥 Resellers</h2><button class="alt" onclick="loadResellers()">Refresh</button></div><div class="toolbar"><input id="rq" placeholder="Search reseller..." oninput="renderResellers()"><select id="rf" onchange="renderResellers()"><option value="all">All</option><option value="active">Active</option><option value="blocked">Blocked</option><option value="expired">Expired</option></select></div><div class="tablewrap"><table><thead><tr><th>Username</th><th>Status</th><th>Expiry</th><th>Balance</th><th>Actions</th></tr></thead><tbody id="resellers"></tbody></table></div></div>
<div class="card"><div class="row"><h2 style="margin:0">🔑 Global Keys</h2><button class="alt" onclick="loadKeys()">Refresh</button></div><div class="toolbar"><input id="kq" placeholder="Search key / APK..." oninput="renderKeys()"><select id="ks" onchange="renderKeys()"><option value="all">All</option><option>UNUSED</option><option>ACTIVE</option><option>BLOCKED</option></select></div><div class="tablewrap"><table><thead><tr><th>Key</th><th>APK</th><th>Owner</th><th>Duration</th><th>Devices</th><th>Status</th><th>Action</th></tr></thead><tbody id="keys"></tbody></table></div></div>
<div class="card"><div class="row"><h2 style="margin:0">❤️ Panel Health</h2><button class="alt" onclick="health()">Check</button></div><div id="health" class="grid"></div></div>
<div class="card"><div class="row"><h2 style="margin:0">🧾 Recent Activity</h2><button class="alt" onclick="activity()">Refresh</button></div><div id="activity"></div></div>
</main><script>
const $=id=>document.getElementById(id);const api=async(u,o={})=>{const r=await fetch(u,{headers:{'Content-Type':'application/json'},...o});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Request failed');return d};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const date=x=>x?new Date(x).toLocaleString():'—';const expired=x=>x&&new Date(x)<=new Date();const soon=x=>{if(!x)return false;const n=new Date(x)-Date.now();return n>0&&n<=604800000};let P=[],R=[],K=[],A={};
function msg(x){$('msg').textContent=x}
async function loadAnalytics(){try{A=await api('/api/master/analytics');const z=[['Keys Total',A.keys?.total],['Keys Active',A.keys?.active],['Keys Blocked',A.keys?.blocked],['Resellers',A.resellers?.total],['Active Resellers',A.resellers?.active],['Customer Panels',A.panels?.total],['Active Panels',A.panels?.active],['Wallet Credits','₹'+(A.money?.credits||0)],['License Debits','₹'+(A.money?.license_debits||0)],['Today Debits','₹'+(A.money?.today_license_debits||0)];$('analytics').innerHTML=z.map(x=>'<div class="card stat"><span class="muted">'+esc(x[0])+'</span><b>'+esc(x[1])+'</b></div>').join('');const d=A.daily||[];const mx=Math.max(...d.map(x=>Number(x.amount||0)),1);$('chart').innerHTML=d.map(x=>'<div style="margin:8px 0"><div class="row"><span>'+esc(x.day)+'</span><span>₹'+Number(x.amount||0)+'</span></div><div class="bar"><i style="width:'+Math.round(Number(x.amount||0)/mx*100)+'%"></i></div></div>').join('')}catch(e){msg(e.message)}}
async function loadPanels(){try{P=await api('/api/owner/panels');renderPanels()}catch(e){msg(e.message)}}
function renderPanels(){const q=($('pq').value||'').toLowerCase(),f=$('pf').value;const rows=P.filter(p=>{const t=(p.panel_name+' '+p.panel_url+' '+(p.owner_username||'')).toLowerCase();return(!q||t.includes(q))&&(f==='all'||(f==='active'&&p.active)||(f==='blocked'&&!p.active)||(f==='soon'&&p.active&&soon(p.panel_expires_at)))});$('panels').innerHTML=rows.map(p=>'<tr><td><b>'+esc(p.panel_name)+'</b><br><span class="muted">'+esc(p.panel_url)+'</span></td><td>'+esc(p.owner_username||'—')+'</td><td><span class="'+(p.active&&!expired(p.panel_expires_at)?'ok':'bad')+'">'+(p.active&&!expired(p.panel_expires_at)?'ACTIVE':expired(p.panel_expires_at)?'EXPIRED':'BLOCKED')+'</span></td><td>'+date(p.panel_expires_at)+'</td><td><div class="actions"><button onclick="pc('+p.id+',\'block\')">BLOCK</button><button onclick="pc('+p.id+',\'unblock\')">UNBLOCK</button><button onclick="pc('+p.id+',\'extend\',30)">+30D</button><button onclick="pc('+p.id+',\'extend\',90)">+90D</button></div></td></tr>').join('')||'<tr><td colspan="5">No panels</td></tr>'}
async function pc(id,action,days){if(!confirm(action.toUpperCase()+' customer panel?'))return;try{const body={action};if(days)body.days=days;await api('/api/owner/panels/'+id+'/control',{method:'POST',body:JSON.stringify(body)});await loadPanels();await health()}catch(e){alert(e.message)}}
async function loadResellers(){try{R=(await api('/api/users')).filter(x=>x.role==='reseller');renderResellers()}catch(e){msg(e.message)}}
function renderResellers(){const q=($('rq').value||'').toLowerCase(),f=$('rf').value;const rows=R.filter(u=>{const ex=expired(u.panel_expires_at),t=(u.username+' '+(u.referral_code||'')).toLowerCase();return(!q||t.includes(q))&&(f==='all'||(f==='active'&&u.active&&!ex)||(f==='blocked'&&!u.active)||(f==='expired'&&ex))});$('resellers').innerHTML=rows.map(u=>'<tr><td><b>'+esc(u.username)+'</b></td><td><span class="'+(u.active&&!expired(u.panel_expires_at)?'ok':'bad')+'">'+(!u.active?'BLOCKED':expired(u.panel_expires_at)?'EXPIRED':'ACTIVE')+'</span></td><td>'+date(u.panel_expires_at)+'</td><td>₹'+esc(u.balance||0)+'</td><td><div class="actions"><button onclick="rc('+u.id+','+(u.active?0:1)+')">'+(u.active?'BLOCK':'UNBLOCK')+'</button><button onclick="re('+u.id+',30)">+30D</button><button onclick="re('+u.id+',90)">+90D</button></div></td></tr>').join('')||'<tr><td colspan="5">No resellers</td></tr>'}
async function rc(id,active){try{await api('/api/users/'+id,{method:'PATCH',body:JSON.stringify({active})});await loadResellers()}catch(e){alert(e.message)}}
async function re(id,days){try{await api('/api/users/'+id,{method:'PATCH',body:JSON.stringify({panelDays:days})});await loadResellers()}catch(e){alert(e.message)}}
async function loadKeys(){try{K=await api('/api/keys');renderKeys()}catch(e){msg(e.message)}}
function renderKeys(){const q=($('kq').value||'').toLowerCase(),s=$('ks').value;const rows=K.filter(k=>(!q||(k.license_key+' '+k.game+' '+(k.owner||'')).toLowerCase().includes(q))&&(s==='all'||k.status===s));$('keys').innerHTML=rows.map(k=>'<tr><td><b>'+esc(k.license_key)+'</b></td><td>'+esc(k.game)+'</td><td>'+esc(k.owner||'Unknown')+'</td><td>'+esc(k.duration)+'</td><td>'+esc(k.devices_used)+'/'+esc(k.max_devices)+'</td><td>'+esc(k.status)+'</td><td><button onclick="kt('+k.id+',\''+(k.status==='BLOCKED'?'UNUSED':'BLOCKED')+'\')">'+(k.status==='BLOCKED'?'UNBLOCK':'BLOCK')+'</button></td></tr>').join('')||'<tr><td colspan="7">No keys</td></tr>'}
async function kt(id,status){if(!confirm(status+' this key?'))return;try{await api('/api/keys/'+id,{method:'PATCH',body:JSON.stringify({status})});await loadKeys()}catch(e){alert(e.message)}}
async function health(){const out=[];for(const p of P){const t=performance.now();try{await api('/api/owner/panels/'+p.id+'/control',{method:'POST',body:JSON.stringify({action:'refresh'})});out.push('<div class="card"><b>'+esc(p.panel_name)+'</b><div class="ok">ONLINE</div><span class="muted">'+Math.round(performance.now()-t)+' ms</span></div>')}catch(e){out.push('<div class="card"><b>'+esc(p.panel_name)+'</b><div class="bad">OFFLINE</div><span class="muted">'+esc(e.message)+'</span></div>')}}$('health').innerHTML=out.join('')||'<div class="card">No panels</div>'}
async function activity(){try{const a=await api('/api/audit-logs?limit=12');$('activity').innerHTML=a.map(x=>'<div class="card"><b>'+esc(x.event_type)+'</b> · '+esc(x.username||'system')+'<div class="muted">'+date(x.created_at)+'</div></div>').join('')||'<div class="muted">No activity</div>'}catch(e){$('activity').textContent=e.message}}
async function bulkResellers(active){if(!confirm((active?'UNBLOCK':'BLOCK')+' ALL RESELLERS?'))return;for(const u of R)if(Boolean(u.active)!==Boolean(active))await rc(u.id,active);msg('Reseller bulk action complete ✅')}
async function bulkPanels(action){if(!confirm((action==='block'?'BLOCK':'UNBLOCK')+' ALL CUSTOMER PANELS?'))return;for(const p of P)if((action==='block'&&p.active)||(action==='unblock'&&!p.active))await pc(p.id,action);msg('Customer bulk action complete ✅')}
async function refreshAll(){await Promise.all([loadPanels(),loadResellers(),loadKeys(),loadAnalytics()]);await health();await activity();msg('Everything synced ✅')}
refreshAll();
</script></body></html>
