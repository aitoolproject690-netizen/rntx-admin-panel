<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DANGER OWNER CONTROL</title><link rel="stylesheet" href="/style.css"></head>
<body>
<div id="app"><header><div class="brand">🛡️ <b>DANGER OWNER CONTROL</b></div><a href="/admin" style="color:#fff;text-decoration:none">MASTER ADMIN</a></header>
<main style="margin-left:0;max-width:1250px;margin:auto;padding:28px">
<section class="page"><div class="row"><h2>OWNER CONTROL</h2><button onclick="loadPanels()">↻ REFRESH</button></div>
<div class="card formcard" style="max-width:760px"><h3>ADD CUSTOMER PANEL</h3>
<label>Panel Name</label><input id="pn" placeholder="Customer / Brand name">
<label>Panel URL</label><input id="pu" placeholder="https://customer.onrender.com">
<label>Customer Admin Username</label><input id="puser" placeholder="customer username">
<label>Validity Days</label><input id="pdays" type="number" min="1" max="3650" value="30">
<label>Control Secret (32+ chars)</label><input id="psecret" type="password" placeholder="Same secret must be set on customer panel">
<button onclick="createPanel()">ADD CUSTOMER PANEL</button><div id="msg" class="copy-msg"></div></div>
<div id="panels"></div></section></main></div>
<script>
const $=id=>document.getElementById(id);
async function api(url,opt={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Request failed');return d}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]||m))}
function fmt(x){return x?new Date(x).toLocaleString():'—'}
async function loadPanels(){try{const rows=await api('/api/owner/panels');$('panels').innerHTML=rows.map(p=>`
<div class="card"><div class="row"><div><h3>${esc(p.panel_name)}</h3><div class="muted">${esc(p.panel_url)}</div></div><span class="pill ${p.active?'':'danger-pill'}">${p.active?'ACTIVE':'BLOCKED'}</span></div>
<p>Admin: <b>${esc(p.owner_username||'—')}</b> · Expiry: <b>${fmt(p.panel_expires_at)}</b></p>
<div class="row" style="flex-wrap:wrap">
<button onclick="control(${p.id},'block')">BLOCK</button><button onclick="control(${p.id},'unblock')">UNBLOCK</button>
<button onclick="extendPanel(${p.id})">EXTEND</button><button onclick="resetCreds(${p.id})">RESET LOGIN</button>
<button class="danger" onclick="removeRecord(${p.id})">REMOVE RECORD</button></div></div>`).join('')||'<div class="card">No customer panels registered yet.</div>'}catch(e){$('panels').innerHTML='<div class="card">'+esc(e.message)+'</div>'}}
async function createPanel(){try{const d=await api('/api/owner/panels',{method:'POST',body:JSON.stringify({panelName:$('pn').value,panelUrl:$('pu').value,ownerUsername:$('puser').value,days:Number($('pdays').value),controlSecret:$('psecret').value})});$('msg').textContent='Customer panel registered. ID: '+d.id;loadPanels()}catch(e){$('msg').textContent=e.message}}
async function control(id,action){if(!confirm(action.toUpperCase()+' this customer panel?'))return;try{await api('/api/owner/panels/'+id+'/control',{method:'POST',body:JSON.stringify({action})});loadPanels()}catch(e){alert(e.message)}}
async function extendPanel(id){const days=prompt('Kitne din extend karna hai?','30');if(days===null)return;try{await api('/api/owner/panels/'+id+'/control',{method:'POST',body:JSON.stringify({action:'extend',days:Number(days)})});loadPanels()}catch(e){alert(e.message)}}
async function resetCreds(id){const username=prompt('New customer username:');if(username===null)return;const password=prompt('New customer password (8+ chars):');if(password===null)return;try{await api('/api/owner/panels/'+id+'/control',{method:'POST',body:JSON.stringify({action:'reset_credentials',username,password})});loadPanels();alert('Customer login reset ho gaya.')}catch(e){alert(e.message)}}
async function removeRecord(id){if(!confirm('Sirf owner registry se record remove hoga. Customer panel delete nahi hoga. Continue?'))return;await api('/api/owner/panels/'+id,{method:'DELETE'});loadPanels()}
loadPanels();
</script></body></html>
